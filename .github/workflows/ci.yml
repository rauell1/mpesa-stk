name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a run be started from the Actions tab or the API without pushing a
  # commit. Useful on its own, and the only way to confirm CI works on a fork
  # the moment Actions is enabled — forks start with Actions disabled, so a
  # workflow can sit here looking healthy while never having run once.
  workflow_dispatch:

# Least privilege: this workflow only ever reads the checkout. Without an
# explicit block the token gets whatever the repository default is, which on
# older repositories is still read/write for everything.
permissions:
  contents: read

# A new push supersedes the run in flight for the same branch. The default is
# to run both to completion, which just queues work nobody reads.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck / test / build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 18 is the floor declared in package.json engines, so it is tested
        # even though it is past end-of-life upstream.
        node-version: [18, 20, 22]
      # Don't cancel the whole matrix if one version fails — see all failures at once
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
